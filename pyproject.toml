[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="psychohistory24"
version="0.1.0"
description="Evidence-driven, point-in-time Psychohistory 2.4 analysis engine"
requires-python=">=3.11"
dependencies=["numpy>=1.24","scipy>=1.10","networkx>=3.0","PyYAML>=6.0"]

[project.optional-dependencies]
dev=["pytest>=8","ruff>=0.6"]

[project.scripts]
psychohistory="psychohistory.cli:main"

[tool.setuptools.packages.find]
include=["psychohistory*"]

[tool.pytest.ini_options]
testpaths=["tests"]

[tool.ruff.lint]
ignore=["I001"]
