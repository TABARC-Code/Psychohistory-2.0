name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: ruff check psychohistory tests
      - name: Mathematical verification (synthetic)
        run: python -m psychohistory.selftest
      - name: Empty-ledger epistemic check
        run: psychohistory --db /tmp/psychohistory-empty.db evaluate --as-of "2026-10-06T22:00:00+00:00"
      - name: Load frozen prospective ledger
        run: python -m psychohistory.bootstrap --db /tmp/psychohistory-live.db
      - name: Evaluate frozen prospective ledger
        run: psychohistory --db /tmp/psychohistory-live.db evaluate --as-of "2026-10-07T00:00:00+01:00"
