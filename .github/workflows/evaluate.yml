name: Scheduled evaluation
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: mkdir -p reports registry
      - name: Mathematical verification (synthetic)
        run: python -m psychohistory.selftest > reports/verification.json
      - name: Empirical forecast evaluation
        run: psychohistory --db registry/psychohistory.db evaluate --as-of "$(date -u +%FT%TZ)" > reports/latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: psychohistory-evaluation
          path: |
            reports/verification.json
            reports/latest.json
